        with:
          python-version: ${{ steps.pyver.outputs.version }}
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Cache Lambda Docker images
        id: cache-lambda-images
        uses: actions/cache@v4
        with:
          path: /tmp/lambda-docker-images
          key: lambda-docker-python3.12-nodejs20
      - name: Load cached Lambda Docker images
        if: steps.cache-lambda-images.outputs.cache-hit == 'true'
        run: |
          docker load -i /tmp/lambda-docker-images/python312.tar
          docker load -i /tmp/lambda-docker-images/nodejs20.tar
      - name: Pull and cache Lambda Docker images
        if: steps.cache-lambda-images.outputs.cache-hit != 'true'
        run: |
          docker pull public.ecr.aws/lambda/python:3.12
          docker pull public.ecr.aws/lambda/nodejs:20
          mkdir -p /tmp/lambda-docker-images
          docker save public.ecr.aws/lambda/python:3.12 -o /tmp/lambda-docker-images/python312.tar
          docker save public.ecr.aws/lambda/nodejs:20 -o /tmp/lambda-docker-images/nodejs20.tar
      - run: uv pip install --system -e lang/python/core -e lang/python/sdk
      - run: make install
        working-directory: lang/python/example
      - run: make e2e-test
        working-directory: lang/python/example

