name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  pull-requests: write
  checks: write
  contents: read

jobs:
  # ── Core (Python ldk) ──────────────────────────────────────────────────────
  core-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: make install
        working-directory: core
      - run: make lint
        working-directory: core
      - run: make format-check
        working-directory: core

  core-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: make install
        working-directory: core
      - run: make test
        working-directory: core

  core-test-e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Pull Lambda Docker images
        run: |
          docker pull public.ecr.aws/lambda/python:3.12
          docker pull public.ecr.aws/lambda/nodejs:20
      - run: make install
        working-directory: core
      - run: make test-e2e
        working-directory: core

  # ── Python SDK ─────────────────────────────────────────────────────────────
  python-sdk-test:
    needs: [core-test]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install ldk
        run: uv pip install --system -e core
      - name: Test
        working-directory: lang/python/sdk
        run: uv run pytest

  # ── TypeScript SDK ─────────────────────────────────────────────────────────
  typescript-sdk-test:
    needs: [core-test]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Install ldk
        run: uv pip install --system -e core
      - name: Test
        working-directory: lang/typescript/sdk
        run: npm ci && npm test

  # ── JavaScript SDK ─────────────────────────────────────────────────────────
  javascript-sdk-test:
    needs: [core-test]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Install ldk
        run: uv pip install --system -e core
      - name: Test
        working-directory: lang/javascript/sdk
        run: npm ci && npm test

  # ── Java SDK ───────────────────────────────────────────────────────────────
  java-sdk-test:
    needs: [core-test]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-java@v4
        with:
          java-version: "17"
          distribution: "temurin"
      - name: Install ldk
        run: uv pip install --system -e core
      - name: Test
        working-directory: lang/java/sdk
        run: ./gradlew test

  # ── Go SDK ─────────────────────────────────────────────────────────────────
  go-sdk-test:
    needs: [core-test]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-go@v5
        with:
          go-version: "1.23"
      - name: Install ldk
        run: uv pip install --system -e core
      - name: Test
        working-directory: lang/go/sdk
        run: go test ./...
