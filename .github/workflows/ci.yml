    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Pull Lambda Docker images
        run: |
          docker pull public.ecr.aws/lambda/python:3.12
      - name: Install ldk and lws
        run: uv pip install --system -e lang/python/core
      - name: Install CDK dependencies
        working-directory: lang/python/sample/cdk
        run: npm ci
      - name: CDK Synth
        working-directory: lang/python/sample/cdk
        run: npx cdk synth
      - name: Start ldk dev
        working-directory: lang/python/sample/cdk
        run: ldk dev &
      - name: Wait for ldk to be ready
        run: |
          for i in $(seq 1 60); do
            if curl -sf http://localhost:3000/_ldk/status | python3 -c "import sys,json; d=json.load(sys.stdin); exit(0 if d.get('running') else 1)" 2>/dev/null; then
              echo "ldk is ready"
              exit 0
            fi
            sleep 1
          done
          echo "ldk failed to start" && exit 1
      - name: Run test-orders.sh
        working-directory: lang/python/sample/cdk
        run: ./test-orders.sh

