name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  pull-requests: write
  checks: write
  contents: read

jobs:
  # ── Detect changed paths ────────────────────────────────────────────────────
  changes:
    runs-on: ubuntu-latest
    outputs:
      python-core: ${{ steps.filter.outputs.python-core }}
      python-sdk: ${{ steps.filter.outputs.python-sdk }}
      python-example: ${{ steps.filter.outputs.python-example }}
      core: ${{ steps.filter.outputs.core }}
      python-sample-cdk: ${{ steps.filter.outputs.python-sample-cdk }}
      python-sample-hcl: ${{ steps.filter.outputs.python-sample-hcl }}
      specification: ${{ steps.filter.outputs.specification }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            python-core:
              - 'lang/python/core/**'
              - 'lang/python/arch_tests/**'
              - 'lang/python/sdk/**'
              - 'lang/python/example/**'
              - 'lang/specification/**'
            python-sdk:
              - 'lang/python/sdk/**'
              - 'lang/python/core/**'
              - 'lang/python/arch_tests/**'
              - 'lang/python/example/**'
              - 'lang/specification/**'
            python-example:
              - 'lang/python/example/**'
              - 'lang/python/sdk/**'
              - 'lang/python/core/**'
              - 'lang/python/arch_tests/**'
              - 'lang/specification/**'
            core:
              - 'lang/python/core/**'
            python-sample-cdk:
              - 'lang/python/sample/cdk/**'
              - 'lang/python/core/**'
              - 'lang/python/sdk/**'
            python-sample-hcl:
              - 'lang/python/sample/hcl/**'
              - 'lang/python/core/**'
              - 'lang/python/sdk/**'
            specification:
              - 'lang/specification/core/formal/**'

  # ── FizzBee Formal Specs ────────────────────────────────────────────────────
  fizzbee-check:
    needs: [changes]
    if: needs.changes.outputs.specification == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - name: Install FizzBee
        run: |
          curl -L https://github.com/fizzbee-io/fizzbee/releases/download/v0.4.0/fizzbee-v0.4.0-linux_x86.tar.gz -o fizzbee.tar.gz
          echo "d8490771e3ba7ad38b264bd1588f783753c5abf2d8582c5ac15f7379812a30d2  fizzbee.tar.gz" | sha256sum -c
          tar -xzf fizzbee.tar.gz
          sudo cp -r fizzbee-v0.4.0-linux_x86/. /usr/local/bin/
      - name: Install FizzBee MBT
        run: |
          curl -L https://github.com/fizzbee-io/fizzbee-mbt-releases/releases/download/v0.2.0/fizzbee-mbt-0.2.0-linux_x86.tar.gz -o fizzbee-mbt.tar.gz
          echo "14228be2ea9773178fc2cf6d6cddc4eb9728d2d6e4fd08c990210f8814169dba  fizzbee-mbt.tar.gz" | sha256sum -c
          tar -xzf fizzbee-mbt.tar.gz
          sudo install -m 755 fizzbee-mbt-0.2.0-linux_x86/fizzbee-mbt-runner /usr/local/bin/fizzbee-mbt-runner
          sudo install -m 755 fizzbee-mbt-0.2.0-linux_x86/fizzbee-mbt-server /usr/local/bin/fizzbee-mbt-server
      - name: Run FizzBee model checker
        run: |
          for spec in lang/specification/core/formal/*/*.fizz lang/specification/core/formal/integrations/*/*.fizz; do
            echo "Checking: $spec"
            if ! timeout 120 fizz "$spec"; then
              echo "::warning::FizzBee check failed for $spec"
            fi
          done

  # ── Python Core ─────────────────────────────────────────────────────────────
  python-core-lint:
    needs: [changes]
    if: needs.changes.outputs.python-core == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v4
      - id: pyver
        run: echo "version=$(cat lang/python/.python-version)" >> $GITHUB_OUTPUT
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ steps.pyver.outputs.version }}
      - run: make install
        working-directory: lang/python/core
      - run: make lint
        working-directory: lang/python/core

  python-core-test-unit:
    needs: [changes]
    if: needs.changes.outputs.python-core == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v4
      - id: pyver
        run: echo "version=$(cat lang/python/.python-version)" >> $GITHUB_OUTPUT
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ steps.pyver.outputs.version }}
      - run: make install
        working-directory: lang/python/core
      - run: make test-unit
        working-directory: lang/python/core

  python-core-test-architecture:
    needs: [changes]
    if: needs.changes.outputs.python-core == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v4
      - id: pyver
        run: echo "version=$(cat lang/python/.python-version)" >> $GITHUB_OUTPUT
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ steps.pyver.outputs.version }}
      - run: make install
        working-directory: lang/python/core
      - run: make test-architecture
        working-directory: lang/python/core

  # ── Python SDK ──────────────────────────────────────────────────────────────
  python-sdk-lint:
    needs: [changes, python-core-lint, python-core-test-unit, python-core-test-architecture]
    if: |
      always() &&
      !cancelled() &&
      needs.changes.outputs.python-sdk == 'true' &&
      (needs.python-core-lint.result == 'success' || needs.python-core-lint.result == 'skipped') &&
      (needs.python-core-test-unit.result == 'success' || needs.python-core-test-unit.result == 'skipped') &&
      (needs.python-core-test-architecture.result == 'success' || needs.python-core-test-architecture.result == 'skipped')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v4
      - id: pyver
        run: echo "version=$(cat lang/python/.python-version)" >> $GITHUB_OUTPUT
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ steps.pyver.outputs.version }}
      - run: uv pip install --system -e lang/python/core
      - run: make install
        working-directory: lang/python/sdk
      - run: make lint
        working-directory: lang/python/sdk

  python-sdk-test-unit:
    needs: [changes, python-core-lint, python-core-test-unit, python-core-test-architecture]
    if: |
      always() &&
      !cancelled() &&
      needs.changes.outputs.python-sdk == 'true' &&
      (needs.python-core-lint.result == 'success' || needs.python-core-lint.result == 'skipped') &&
      (needs.python-core-test-unit.result == 'success' || needs.python-core-test-unit.result == 'skipped') &&
      (needs.python-core-test-architecture.result == 'success' || needs.python-core-test-architecture.result == 'skipped')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v4
      - id: pyver
        run: echo "version=$(cat lang/python/.python-version)" >> $GITHUB_OUTPUT
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ steps.pyver.outputs.version }}
      - run: uv pip install --system -e lang/python/core
      - run: make install
        working-directory: lang/python/sdk
      - run: make test-unit
        working-directory: lang/python/sdk

  python-sdk-test-architecture:
    needs: [changes, python-core-lint, python-core-test-unit, python-core-test-architecture]
    if: |
      always() &&
      !cancelled() &&
      needs.changes.outputs.python-sdk == 'true' &&
      (needs.python-core-lint.result == 'success' || needs.python-core-lint.result == 'skipped') &&
      (needs.python-core-test-unit.result == 'success' || needs.python-core-test-unit.result == 'skipped') &&
      (needs.python-core-test-architecture.result == 'success' || needs.python-core-test-architecture.result == 'skipped')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v4
      - id: pyver
        run: echo "version=$(cat lang/python/.python-version)" >> $GITHUB_OUTPUT
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ steps.pyver.outputs.version }}
      - run: uv pip install --system -e lang/python/core
      - run: make install
        working-directory: lang/python/sdk
      - run: make test-architecture
        working-directory: lang/python/sdk

  python-sdk-e2e-suites:
    needs: [changes]
    if: |
      always() && !cancelled() && needs.changes.outputs.python-sdk == 'true'
    runs-on: ubuntu-latest
    outputs:
      suites: ${{ steps.list.outputs.suites }}
    steps:
      - uses: actions/checkout@v4
      - id: list
        run: |
          suites=$(grep -rL "Placeholder" lang/python/sdk/tests/e2e/*/test_scenarios.py | \
            sed 's|.*/e2e/||;s|/test_scenarios.py||' | \
            jq -R . | jq -sc .)
          echo "suites=$suites" >> $GITHUB_OUTPUT

  python-sdk-test-e2e-minimal:
    needs: [changes, python-sdk-e2e-suites, python-sdk-lint, python-sdk-test-unit, python-sdk-test-architecture]
    if: |
      always() &&
      !cancelled() &&
      needs.changes.outputs.python-sdk == 'true' &&
      (needs.python-sdk-e2e-suites.result == 'success' || needs.python-sdk-e2e-suites.result == 'skipped') &&
      (needs.python-sdk-lint.result == 'success' || needs.python-sdk-lint.result == 'skipped') &&
      (needs.python-sdk-test-unit.result == 'success' || needs.python-sdk-test-unit.result == 'skipped') &&
      (needs.python-sdk-test-architecture.result == 'success' || needs.python-sdk-test-architecture.result == 'skipped')
    strategy:
      fail-fast: false
      matrix:
        suite: ${{ fromJSON(needs.python-sdk-e2e-suites.outputs.suites) }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v4
      - id: pyver
        run: echo "version=$(cat lang/python/.python-version)" >> $GITHUB_OUTPUT
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ steps.pyver.outputs.version }}
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Cache Lambda Docker images
        id: cache-lambda-images
        uses: actions/cache@v4
        with:
          path: /tmp/lambda-docker-images
          key: lambda-docker-python3.12-nodejs20
      - name: Load cached Lambda Docker images
        if: steps.cache-lambda-images.outputs.cache-hit == 'true'
        run: |
          docker load -i /tmp/lambda-docker-images/python312.tar
          docker load -i /tmp/lambda-docker-images/nodejs20.tar
      - name: Pull and cache Lambda Docker images
        if: steps.cache-lambda-images.outputs.cache-hit != 'true'
        run: |
          docker pull public.ecr.aws/lambda/python:3.12
          docker pull public.ecr.aws/lambda/nodejs:20
          mkdir -p /tmp/lambda-docker-images
          docker save public.ecr.aws/lambda/python:3.12 -o /tmp/lambda-docker-images/python312.tar
          docker save public.ecr.aws/lambda/nodejs:20 -o /tmp/lambda-docker-images/nodejs20.tar
      - run: uv pip install --system -e lang/python/core
      - run: make install
        working-directory: lang/python/sdk
      - env:
          SUITE: ${{ matrix.suite }}
        run: make test-e2e-minimal SUITE="tests/e2e/$SUITE"
        working-directory: lang/python/sdk
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: python-sdk-test-e2e-results-minimal-${{ matrix.suite }}
          path: lang/python/sdk/test-results/junit-minimal.xml

  python-sdk-test-e2e-guard:
    needs: [changes, python-sdk-e2e-suites, python-sdk-lint, python-sdk-test-unit, python-sdk-test-architecture]
    if: |
      always() &&
      !cancelled() &&
      needs.changes.outputs.python-sdk == 'true' &&
      (needs.python-sdk-e2e-suites.result == 'success' || needs.python-sdk-e2e-suites.result == 'skipped') &&
      (needs.python-sdk-lint.result == 'success' || needs.python-sdk-lint.result == 'skipped') &&
      (needs.python-sdk-test-unit.result == 'success' || needs.python-sdk-test-unit.result == 'skipped') &&
      (needs.python-sdk-test-architecture.result == 'success' || needs.python-sdk-test-architecture.result == 'skipped')
    strategy:
      fail-fast: false
      matrix:
        suite: ${{ fromJSON(needs.python-sdk-e2e-suites.outputs.suites) }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v4
      - id: pyver
        run: echo "version=$(cat lang/python/.python-version)" >> $GITHUB_OUTPUT
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ steps.pyver.outputs.version }}
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Cache Lambda Docker images
        id: cache-lambda-images
        uses: actions/cache@v4
        with:
          path: /tmp/lambda-docker-images
          key: lambda-docker-python3.12-nodejs20
      - name: Load cached Lambda Docker images
        if: steps.cache-lambda-images.outputs.cache-hit == 'true'
        run: |
          docker load -i /tmp/lambda-docker-images/python312.tar
          docker load -i /tmp/lambda-docker-images/nodejs20.tar
      - name: Pull and cache Lambda Docker images
        if: steps.cache-lambda-images.outputs.cache-hit != 'true'
        run: |
          docker pull public.ecr.aws/lambda/python:3.12
          docker pull public.ecr.aws/lambda/nodejs:20
          mkdir -p /tmp/lambda-docker-images
          docker save public.ecr.aws/lambda/python:3.12 -o /tmp/lambda-docker-images/python312.tar
          docker save public.ecr.aws/lambda/nodejs:20 -o /tmp/lambda-docker-images/nodejs20.tar
      - run: uv pip install --system -e lang/python/core
      - run: make install
        working-directory: lang/python/sdk
      - env:
          SUITE: ${{ matrix.suite }}
        run: make test-e2e-guard SUITE="tests/e2e/$SUITE"
        working-directory: lang/python/sdk
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: python-sdk-test-e2e-results-guard-${{ matrix.suite }}
          path: lang/python/sdk/test-results/junit-guard.xml

  python-sdk-test-e2e-sequence:
    needs: [changes, python-sdk-e2e-suites, python-sdk-lint, python-sdk-test-unit, python-sdk-test-architecture]
    if: |
      always() &&
      !cancelled() &&
      needs.changes.outputs.python-sdk == 'true' &&
      (needs.python-sdk-e2e-suites.result == 'success' || needs.python-sdk-e2e-suites.result == 'skipped') &&
      (needs.python-sdk-lint.result == 'success' || needs.python-sdk-lint.result == 'skipped') &&
      (needs.python-sdk-test-unit.result == 'success' || needs.python-sdk-test-unit.result == 'skipped') &&
      (needs.python-sdk-test-architecture.result == 'success' || needs.python-sdk-test-architecture.result == 'skipped')
    strategy:
      fail-fast: false
      matrix:
        suite: ${{ fromJSON(needs.python-sdk-e2e-suites.outputs.suites) }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v4
      - id: pyver
        run: echo "version=$(cat lang/python/.python-version)" >> $GITHUB_OUTPUT
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ steps.pyver.outputs.version }}
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Cache Lambda Docker images
        id: cache-lambda-images
        uses: actions/cache@v4
        with:
          path: /tmp/lambda-docker-images
          key: lambda-docker-python3.12-nodejs20
      - name: Load cached Lambda Docker images
        if: steps.cache-lambda-images.outputs.cache-hit == 'true'
        run: |
          docker load -i /tmp/lambda-docker-images/python312.tar
          docker load -i /tmp/lambda-docker-images/nodejs20.tar
      - name: Pull and cache Lambda Docker images
        if: steps.cache-lambda-images.outputs.cache-hit != 'true'
        run: |
          docker pull public.ecr.aws/lambda/python:3.12
          docker pull public.ecr.aws/lambda/nodejs:20
          mkdir -p /tmp/lambda-docker-images
          docker save public.ecr.aws/lambda/python:3.12 -o /tmp/lambda-docker-images/python312.tar
          docker save public.ecr.aws/lambda/nodejs:20 -o /tmp/lambda-docker-images/nodejs20.tar
      - run: uv pip install --system -e lang/python/core
      - run: make install
        working-directory: lang/python/sdk
      - env:
          SUITE: ${{ matrix.suite }}
        run: make test-e2e-sequence SUITE="tests/e2e/$SUITE"
        working-directory: lang/python/sdk
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: python-sdk-test-e2e-results-sequence-${{ matrix.suite }}
          path: lang/python/sdk/test-results/junit-sequence.xml

  python-sdk-e2e-summary:
    needs: [python-sdk-test-e2e-minimal, python-sdk-test-e2e-guard, python-sdk-test-e2e-sequence]
    if: |
      always() &&
      (needs.python-sdk-test-e2e-minimal.result != 'skipped' ||
       needs.python-sdk-test-e2e-guard.result != 'skipped' ||
       needs.python-sdk-test-e2e-sequence.result != 'skipped')
    runs-on: ubuntu-latest
    permissions:
      checks: write
      pull-requests: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: python-sdk-test-e2e-results-*
          merge-multiple: true
          path: all-results/
      - uses: EnricoMi/publish-unit-test-result-action@v2
        with:
          files: all-results/**/*.xml
          check_name: Python SDK E2E Tests

  # ── Python Example ──────────────────────────────────────────────────────────
  python-example-lint:
    needs: [changes, python-sdk-lint, python-sdk-test-unit, python-sdk-test-architecture]
    if: |
      always() &&
      !cancelled() &&
      needs.changes.outputs.python-example == 'true' &&
      (needs.python-sdk-lint.result == 'success' || needs.python-sdk-lint.result == 'skipped') &&
      (needs.python-sdk-test-unit.result == 'success' || needs.python-sdk-test-unit.result == 'skipped') &&
      (needs.python-sdk-test-architecture.result == 'success' || needs.python-sdk-test-architecture.result == 'skipped')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v4
      - id: pyver
        run: echo "version=$(cat lang/python/.python-version)" >> $GITHUB_OUTPUT
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ steps.pyver.outputs.version }}
      - run: uv pip install --system -e lang/python/core -e lang/python/sdk
      - run: make install
        working-directory: lang/python/example
      - run: make lint
        working-directory: lang/python/example

  python-example-test-unit:
    needs: [changes, python-sdk-lint, python-sdk-test-unit, python-sdk-test-architecture]
    if: |
      always() &&
      !cancelled() &&
      needs.changes.outputs.python-example == 'true' &&
      (needs.python-sdk-lint.result == 'success' || needs.python-sdk-lint.result == 'skipped') &&
      (needs.python-sdk-test-unit.result == 'success' || needs.python-sdk-test-unit.result == 'skipped') &&
      (needs.python-sdk-test-architecture.result == 'success' || needs.python-sdk-test-architecture.result == 'skipped')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v4
      - id: pyver
        run: echo "version=$(cat lang/python/.python-version)" >> $GITHUB_OUTPUT
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ steps.pyver.outputs.version }}
      - run: uv pip install --system -e lang/python/core -e lang/python/sdk
      - run: make install
        working-directory: lang/python/example
      - run: make test-unit
        working-directory: lang/python/example

  python-example-test-architecture:
    needs: [changes, python-sdk-lint, python-sdk-test-unit, python-sdk-test-architecture]
    if: |
      always() &&
      !cancelled() &&
      needs.changes.outputs.python-example == 'true' &&
      (needs.python-sdk-lint.result == 'success' || needs.python-sdk-lint.result == 'skipped') &&
      (needs.python-sdk-test-unit.result == 'success' || needs.python-sdk-test-unit.result == 'skipped') &&
      (needs.python-sdk-test-architecture.result == 'success' || needs.python-sdk-test-architecture.result == 'skipped')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v4
      - id: pyver
        run: echo "version=$(cat lang/python/.python-version)" >> $GITHUB_OUTPUT
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ steps.pyver.outputs.version }}
      - run: uv pip install --system -e lang/python/core -e lang/python/sdk
      - run: make install
        working-directory: lang/python/example
      - run: make test-architecture
        working-directory: lang/python/example

  python-example-test-e2e-minimal:
    needs: [changes, python-sdk-test-e2e-minimal, python-example-lint, python-example-test-unit, python-example-test-architecture]
    if: |
      always() &&
      !cancelled() &&
      needs.changes.outputs.python-example == 'true' &&
      (needs.python-sdk-test-e2e-minimal.result == 'success' || needs.python-sdk-test-e2e-minimal.result == 'skipped') &&
      (needs.python-example-lint.result == 'success' || needs.python-example-lint.result == 'skipped') &&
      (needs.python-example-test-unit.result == 'success' || needs.python-example-test-unit.result == 'skipped') &&
      (needs.python-example-test-architecture.result == 'success' || needs.python-example-test-architecture.result == 'skipped')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v4
      - id: pyver
        run: echo "version=$(cat lang/python/.python-version)" >> $GITHUB_OUTPUT
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ steps.pyver.outputs.version }}
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Cache Lambda Docker images
        id: cache-lambda-images
        uses: actions/cache@v4
        with:
          path: /tmp/lambda-docker-images
          key: lambda-docker-python3.12-nodejs20
      - name: Load cached Lambda Docker images
        if: steps.cache-lambda-images.outputs.cache-hit == 'true'
        run: |
          docker load -i /tmp/lambda-docker-images/python312.tar
          docker load -i /tmp/lambda-docker-images/nodejs20.tar
      - name: Pull and cache Lambda Docker images
        if: steps.cache-lambda-images.outputs.cache-hit != 'true'
        run: |
          docker pull public.ecr.aws/lambda/python:3.12
          docker pull public.ecr.aws/lambda/nodejs:20
          mkdir -p /tmp/lambda-docker-images
          docker save public.ecr.aws/lambda/python:3.12 -o /tmp/lambda-docker-images/python312.tar
          docker save public.ecr.aws/lambda/nodejs:20 -o /tmp/lambda-docker-images/nodejs20.tar
      - run: uv pip install --system -e lang/python/core -e lang/python/sdk
      - run: make install
        working-directory: lang/python/example
      - run: make test-e2e-minimal
        working-directory: lang/python/example
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: python-example-test-e2e-results-minimal
          path: lang/python/example/test-results/junit-minimal.xml

  python-example-test-e2e-guard:
    needs: [changes, python-sdk-test-e2e-guard, python-example-lint, python-example-test-unit, python-example-test-architecture]
    if: |
      always() &&
      !cancelled() &&
      needs.changes.outputs.python-example == 'true' &&
      (needs.python-sdk-test-e2e-guard.result == 'success' || needs.python-sdk-test-e2e-guard.result == 'skipped') &&
      (needs.python-example-lint.result == 'success' || needs.python-example-lint.result == 'skipped') &&
      (needs.python-example-test-unit.result == 'success' || needs.python-example-test-unit.result == 'skipped') &&
      (needs.python-example-test-architecture.result == 'success' || needs.python-example-test-architecture.result == 'skipped')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v4
      - id: pyver
        run: echo "version=$(cat lang/python/.python-version)" >> $GITHUB_OUTPUT
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ steps.pyver.outputs.version }}
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Cache Lambda Docker images
        id: cache-lambda-images
        uses: actions/cache@v4
        with:
          path: /tmp/lambda-docker-images
          key: lambda-docker-python3.12-nodejs20
      - name: Load cached Lambda Docker images
        if: steps.cache-lambda-images.outputs.cache-hit == 'true'
        run: |
          docker load -i /tmp/lambda-docker-images/python312.tar
          docker load -i /tmp/lambda-docker-images/nodejs20.tar
      - name: Pull and cache Lambda Docker images
        if: steps.cache-lambda-images.outputs.cache-hit != 'true'
        run: |
          docker pull public.ecr.aws/lambda/python:3.12
          docker pull public.ecr.aws/lambda/nodejs:20
          mkdir -p /tmp/lambda-docker-images
          docker save public.ecr.aws/lambda/python:3.12 -o /tmp/lambda-docker-images/python312.tar
          docker save public.ecr.aws/lambda/nodejs:20 -o /tmp/lambda-docker-images/nodejs20.tar
      - run: uv pip install --system -e lang/python/core -e lang/python/sdk
      - run: make install
        working-directory: lang/python/example
      - run: make test-e2e-guard
        working-directory: lang/python/example
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: python-example-test-e2e-results-guard
          path: lang/python/example/test-results/junit-guard.xml

  python-example-test-e2e-sequence:
    needs: [changes, python-sdk-test-e2e-sequence, python-example-lint, python-example-test-unit, python-example-test-architecture]
    if: |
      always() &&
      !cancelled() &&
      needs.changes.outputs.python-example == 'true' &&
      (needs.python-sdk-test-e2e-sequence.result == 'success' || needs.python-sdk-test-e2e-sequence.result == 'skipped') &&
      (needs.python-example-lint.result == 'success' || needs.python-example-lint.result == 'skipped') &&
      (needs.python-example-test-unit.result == 'success' || needs.python-example-test-unit.result == 'skipped') &&
      (needs.python-example-test-architecture.result == 'success' || needs.python-example-test-architecture.result == 'skipped')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v4
      - id: pyver
        run: echo "version=$(cat lang/python/.python-version)" >> $GITHUB_OUTPUT
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ steps.pyver.outputs.version }}
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Cache Lambda Docker images
        id: cache-lambda-images
        uses: actions/cache@v4
        with:
          path: /tmp/lambda-docker-images
          key: lambda-docker-python3.12-nodejs20
      - name: Load cached Lambda Docker images
        if: steps.cache-lambda-images.outputs.cache-hit == 'true'
        run: |
          docker load -i /tmp/lambda-docker-images/python312.tar
          docker load -i /tmp/lambda-docker-images/nodejs20.tar
      - name: Pull and cache Lambda Docker images
        if: steps.cache-lambda-images.outputs.cache-hit != 'true'
        run: |
          docker pull public.ecr.aws/lambda/python:3.12
          docker pull public.ecr.aws/lambda/nodejs:20
          mkdir -p /tmp/lambda-docker-images
          docker save public.ecr.aws/lambda/python:3.12 -o /tmp/lambda-docker-images/python312.tar
          docker save public.ecr.aws/lambda/nodejs:20 -o /tmp/lambda-docker-images/nodejs20.tar
      - run: uv pip install --system -e lang/python/core -e lang/python/sdk
      - run: make install
        working-directory: lang/python/example
      - run: make test-e2e-sequence
        working-directory: lang/python/example
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: python-example-test-e2e-results-sequence
          path: lang/python/example/test-results/junit-sequence.xml

  python-example-e2e-summary:
    needs: [python-example-test-e2e-minimal, python-example-test-e2e-guard, python-example-test-e2e-sequence]
    if: |
      always() &&
      (needs.python-example-test-e2e-minimal.result != 'skipped' ||
       needs.python-example-test-e2e-guard.result != 'skipped' ||
       needs.python-example-test-e2e-sequence.result != 'skipped')
    runs-on: ubuntu-latest
    permissions:
      checks: write
      pull-requests: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: python-example-test-e2e-results-*
          merge-multiple: true
          path: all-results/
      - uses: EnricoMi/publish-unit-test-result-action@v2
        with:
          files: all-results/**/*.xml
          check_name: Python Example E2E Tests

  # ── Python Sample CDK ───────────────────────────────────────────────────────
  python-sample-cdk-build:
    needs: [changes, python-example-lint, python-example-test-unit, python-example-test-architecture, python-example-test-e2e-minimal, python-example-test-e2e-guard, python-example-test-e2e-sequence]
    if: |
      always() &&
      needs.changes.outputs.python-sample-cdk == 'true' &&
      (needs.python-example-lint.result == 'success' || needs.python-example-lint.result == 'skipped') &&
      (needs.python-example-test-unit.result == 'success' || needs.python-example-test-unit.result == 'skipped') &&
      (needs.python-example-test-architecture.result == 'success' || needs.python-example-test-architecture.result == 'skipped') &&
      (needs.python-example-test-e2e-minimal.result == 'success' || needs.python-example-test-e2e-minimal.result == 'skipped') &&
      (needs.python-example-test-e2e-guard.result == 'success' || needs.python-example-test-e2e-guard.result == 'skipped') &&
      (needs.python-example-test-e2e-sequence.result == 'success' || needs.python-example-test-e2e-sequence.result == 'skipped')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Pull Lambda Docker images
        run: |
          docker pull public.ecr.aws/lambda/python:3.12
      - name: Install ldk and lws
        run: uv pip install --system -e lang/python/core
      - name: Install CDK dependencies
        working-directory: lang/python/sample/cdk
        run: npm ci
      - name: CDK Synth
        working-directory: lang/python/sample/cdk
        run: npx cdk synth
      - name: Start ldk dev
        working-directory: lang/python/sample/cdk
        run: ldk dev &
      - name: Wait for ldk to be ready
        run: |
          for i in $(seq 1 60); do
            if curl -sf http://localhost:3000/_ldk/status | python3 -c "import sys,json; d=json.load(sys.stdin); exit(0 if d.get('running') else 1)" 2>/dev/null; then
              echo "ldk is ready"
              exit 0
            fi
            sleep 1
          done
          echo "ldk failed to start" && exit 1
      - name: Run test-orders.sh
        working-directory: lang/python/sample/cdk
        run: ./test-orders.sh

  # ── Python Sample HCL ───────────────────────────────────────────────────────
  python-sample-hcl-build:
    needs: [changes, python-example-lint, python-example-test-unit, python-example-test-architecture, python-example-test-e2e-minimal, python-example-test-e2e-guard, python-example-test-e2e-sequence]
    if: |
      always() &&
      needs.changes.outputs.python-sample-hcl == 'true' &&
      (needs.python-example-lint.result == 'success' || needs.python-example-lint.result == 'skipped') &&
      (needs.python-example-test-unit.result == 'success' || needs.python-example-test-unit.result == 'skipped') &&
      (needs.python-example-test-architecture.result == 'success' || needs.python-example-test-architecture.result == 'skipped') &&
      (needs.python-example-test-e2e-minimal.result == 'success' || needs.python-example-test-e2e-minimal.result == 'skipped') &&
      (needs.python-example-test-e2e-guard.result == 'success' || needs.python-example-test-e2e-guard.result == 'skipped') &&
      (needs.python-example-test-e2e-sequence.result == 'success' || needs.python-example-test-e2e-sequence.result == 'skipped')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: opentofu/setup-opentofu@v1
      - name: Pull Lambda Docker images
        run: |
          docker pull public.ecr.aws/lambda/python:3.12
      - name: Install ldk and lws
        run: uv pip install --system -e lang/python/core
      - name: Start ldk dev
        working-directory: lang/python/sample/hcl
        run: ldk dev &
      - name: Wait for ldk to be ready
        run: |
          for i in $(seq 1 60); do
            if curl -sf http://localhost:3000/_ldk/status | python3 -c "import sys,json; d=json.load(sys.stdin); exit(0 if d.get('running') else 1)" 2>/dev/null; then
              echo "ldk is ready"
              exit 0
            fi
            sleep 1
          done
          echo "ldk failed to start" && exit 1
      - name: OpenTofu Init
        working-directory: lang/python/sample/hcl
        run: tofu init
      - name: OpenTofu Apply
        working-directory: lang/python/sample/hcl
        run: tofu apply -auto-approve
      - name: Run test-orders.sh
        working-directory: lang/python/sample/hcl
        run: ./test-orders.sh
