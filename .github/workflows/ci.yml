name: CI

on:
  push:
    branches: [main, parity-check]
  pull_request:
    branches: [main, parity-check]

permissions:
  pull-requests: write
  checks: write
  contents: read

jobs:
  # ── Detect changed paths ────────────────────────────────────────────────────
  changes:
    runs-on: ubuntu-latest
    outputs:
      python-core: ${{ steps.filter.outputs.python-core }}
      python-sdk: ${{ steps.filter.outputs.python-sdk }}
      python-example: ${{ steps.filter.outputs.python-example }}
      core: ${{ steps.filter.outputs.core }}
      typescript-core: ${{ steps.filter.outputs.typescript-core }}
      typescript-sdk: ${{ steps.filter.outputs.typescript-sdk }}
      typescript-example: ${{ steps.filter.outputs.typescript-example }}
      java-core: ${{ steps.filter.outputs.java-core }}
      java-sdk: ${{ steps.filter.outputs.java-sdk }}
      java-example: ${{ steps.filter.outputs.java-example }}
      go-core: ${{ steps.filter.outputs.go-core }}
      go-sdk: ${{ steps.filter.outputs.go-sdk }}
      go-example: ${{ steps.filter.outputs.go-example }}
      python-sample-cdk: ${{ steps.filter.outputs.python-sample-cdk }}
      python-sample-hcl: ${{ steps.filter.outputs.python-sample-hcl }}
      typescript-sample-cdk: ${{ steps.filter.outputs.typescript-sample-cdk }}
      typescript-sample-hcl: ${{ steps.filter.outputs.typescript-sample-hcl }}
      java-sample-cdk: ${{ steps.filter.outputs.java-sample-cdk }}
      java-sample-hcl: ${{ steps.filter.outputs.java-sample-hcl }}
      go-sample-cdk: ${{ steps.filter.outputs.go-sample-cdk }}
      go-sample-hcl: ${{ steps.filter.outputs.go-sample-hcl }}
      specification: ${{ steps.filter.outputs.specification }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            python-core:
              - 'lang/python/core/**'
              - 'lang/python/arch_tests/**'
              - 'lang/python/sdk/**'
              - 'lang/python/example/**'
              - 'lang/specification/**'
            python-sdk:
              - 'lang/python/sdk/**'
              - 'lang/python/core/**'
              - 'lang/python/arch_tests/**'
              - 'lang/python/example/**'
              - 'lang/specification/**'
            python-example:
              - 'lang/python/example/**'
              - 'lang/python/sdk/**'
              - 'lang/python/core/**'
              - 'lang/python/arch_tests/**'
              - 'lang/specification/**'
            core:
              - 'lang/python/core/**'
            typescript-core:
              - 'lang/typescript/core/**'
              - 'lang/typescript/arch_tests/**'
              - 'lang/specification/**'
            typescript-sdk:
              - 'lang/typescript/sdk/**'
              - 'lang/typescript/core/**'
              - 'lang/typescript/arch_tests/**'
              - 'lang/specification/**'
            typescript-example:
              - 'lang/typescript/example/**'
              - 'lang/typescript/sdk/**'
              - 'lang/typescript/core/**'
              - 'lang/typescript/arch_tests/**'
              - 'lang/specification/**'
            java-core:
              - 'lang/java/core/**'
              - 'lang/java/arch_tests/**'
              - 'lang/java/config/**'
              - 'lang/specification/**'
            java-sdk:
              - 'lang/java/sdk/**'
              - 'lang/java/core/**'
              - 'lang/java/arch_tests/**'
              - 'lang/java/config/**'
              - 'lang/specification/**'
            java-example:
              - 'lang/java/example/**'
              - 'lang/java/sdk/**'
              - 'lang/java/core/**'
              - 'lang/java/arch_tests/**'
              - 'lang/java/config/**'
              - 'lang/specification/**'
            go-core:
              - 'lang/go/core/**'
              - 'lang/specification/**'
            go-sdk:
              - 'lang/go/sdk/**'
              - 'lang/go/core/**'
              - 'lang/specification/**'
            go-example:
              - 'lang/go/example/**'
              - 'lang/go/sdk/**'
              - 'lang/go/core/**'
              - 'lang/specification/**'
            python-sample-cdk:
              - 'lang/python/sample/cdk/**'
              - 'lang/python/core/**'
              - 'lang/python/sdk/**'
            python-sample-hcl:
              - 'lang/python/sample/hcl/**'
              - 'lang/python/core/**'
              - 'lang/python/sdk/**'
            typescript-sample-cdk:
              - 'lang/typescript/sample/cdk/**'
              - 'lang/typescript/core/**'
              - 'lang/typescript/sdk/**'
            typescript-sample-hcl:
              - 'lang/typescript/sample/hcl/**'
              - 'lang/typescript/core/**'
              - 'lang/typescript/sdk/**'
            java-sample-cdk:
              - 'lang/java/sample/cdk/**'
              - 'lang/java/core/**'
              - 'lang/java/sdk/**'
            java-sample-hcl:
              - 'lang/java/sample/hcl/**'
              - 'lang/java/core/**'
              - 'lang/java/sdk/**'
            go-sample-cdk:
              - 'lang/go/sample/cdk/**'
              - 'lang/go/core/**'
              - 'lang/go/sdk/**'
            go-sample-hcl:
              - 'lang/go/sample/hcl/**'
              - 'lang/go/core/**'
              - 'lang/go/sdk/**'
            specification:
              - 'lang/specification/core/formal/**'

  # ── FizzBee Formal Specs ────────────────────────────────────────────────────
  fizzbee-check:
    needs: [changes]
    if: needs.changes.outputs.specification == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - name: Install FizzBee
        run: |
          curl -L https://github.com/fizzbee-io/fizzbee/releases/download/v0.4.0/fizzbee-v0.4.0-linux_x86.tar.gz -o fizzbee.tar.gz
          echo "d8490771e3ba7ad38b264bd1588f783753c5abf2d8582c5ac15f7379812a30d2  fizzbee.tar.gz" | sha256sum -c
          tar -xzf fizzbee.tar.gz
          sudo cp -r fizzbee-v0.4.0-linux_x86/. /usr/local/bin/
      - name: Install FizzBee MBT
        run: |
          curl -L https://github.com/fizzbee-io/fizzbee-mbt-releases/releases/download/v0.2.0/fizzbee-mbt-0.2.0-linux_x86.tar.gz -o fizzbee-mbt.tar.gz
          echo "14228be2ea9773178fc2cf6d6cddc4eb9728d2d6e4fd08c990210f8814169dba  fizzbee-mbt.tar.gz" | sha256sum -c
          tar -xzf fizzbee-mbt.tar.gz
          sudo install -m 755 fizzbee-mbt-0.2.0-linux_x86/fizzbee-mbt-runner /usr/local/bin/fizzbee-mbt-runner
          sudo install -m 755 fizzbee-mbt-0.2.0-linux_x86/fizzbee-mbt-server /usr/local/bin/fizzbee-mbt-server
      - name: Run FizzBee model checker
        run: |
          for spec in lang/specification/core/formal/*/*.fizz lang/specification/core/formal/integrations/*/*.fizz; do
            echo "Checking: $spec"
            if ! timeout 120 fizz "$spec"; then
              echo "::warning::FizzBee check failed for $spec"
            fi
          done

  # ── Python Core ────────────────────────────────────────────────────────────
  python-core-lint:
    needs: [changes]
    if: needs.changes.outputs.python-core == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v4
      - id: pyver
        run: echo "version=$(cat lang/python/.python-version)" >> $GITHUB_OUTPUT
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ steps.pyver.outputs.version }}
      - run: make install
        working-directory: lang/python/core
      - run: make lint format-check complexity cpd pylint
        working-directory: lang/python/core

  python-core-unit-test:
    needs: [changes]
    if: needs.changes.outputs.python-core == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v4
      - id: pyver
        run: echo "version=$(cat lang/python/.python-version)" >> $GITHUB_OUTPUT
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ steps.pyver.outputs.version }}
      - run: make install
        working-directory: lang/python/core
      - run: make unit-test
        working-directory: lang/python/core

  python-core-integration-test:
    needs: [changes]
    if: needs.changes.outputs.python-core == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v4
      - id: pyver
        run: echo "version=$(cat lang/python/.python-version)" >> $GITHUB_OUTPUT
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ steps.pyver.outputs.version }}
      - run: make install
        working-directory: lang/python/core
      - run: make integration-test
        working-directory: lang/python/core

  python-core-architecture-test:
    needs: [changes]
    if: needs.changes.outputs.python-core == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v4
      - id: pyver
        run: echo "version=$(cat lang/python/.python-version)" >> $GITHUB_OUTPUT
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ steps.pyver.outputs.version }}
      - run: make install
        working-directory: lang/python/core
      - run: make architecture-test
        working-directory: lang/python/core

  # ── Python SDK ─────────────────────────────────────────────────────────────
  python-sdk-lint:
    needs: [changes, python-core-lint, python-core-unit-test, python-core-integration-test, python-core-architecture-test]
    if: |
      always() &&
      !cancelled() &&
      needs.changes.outputs.python-sdk == 'true' &&
      (needs.python-core-lint.result == 'success' || needs.python-core-lint.result == 'skipped') &&
      (needs.python-core-unit-test.result == 'success' || needs.python-core-unit-test.result == 'skipped') &&
      (needs.python-core-integration-test.result == 'success' || needs.python-core-integration-test.result == 'skipped') &&
      (needs.python-core-architecture-test.result == 'success' || needs.python-core-architecture-test.result == 'skipped')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v4
      - id: pyver
        run: echo "version=$(cat lang/python/.python-version)" >> $GITHUB_OUTPUT
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ steps.pyver.outputs.version }}
      - run: make install
        working-directory: lang/python/sdk
      - run: make lint format-check complexity cpd pylint
        working-directory: lang/python/sdk

  python-sdk-unit-test:
    needs: [changes, python-core-lint, python-core-unit-test, python-core-integration-test, python-core-architecture-test]
    if: |
      always() &&
      !cancelled() &&
      needs.changes.outputs.python-sdk == 'true' &&
      (needs.python-core-lint.result == 'success' || needs.python-core-lint.result == 'skipped') &&
      (needs.python-core-unit-test.result == 'success' || needs.python-core-unit-test.result == 'skipped') &&
      (needs.python-core-integration-test.result == 'success' || needs.python-core-integration-test.result == 'skipped') &&
      (needs.python-core-architecture-test.result == 'success' || needs.python-core-architecture-test.result == 'skipped')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v4
      - id: pyver
        run: echo "version=$(cat lang/python/.python-version)" >> $GITHUB_OUTPUT
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ steps.pyver.outputs.version }}
      - run: uv pip install --system -e lang/python/core
      - run: make install
        working-directory: lang/python/sdk
      - run: make unit-test
        working-directory: lang/python/sdk

  python-sdk-architecture-test:
    needs: [changes, python-core-lint, python-core-unit-test, python-core-integration-test, python-core-architecture-test]
    if: |
      always() &&
      !cancelled() &&
      needs.changes.outputs.python-sdk == 'true' &&
      (needs.python-core-lint.result == 'success' || needs.python-core-lint.result == 'skipped') &&
      (needs.python-core-unit-test.result == 'success' || needs.python-core-unit-test.result == 'skipped') &&
      (needs.python-core-integration-test.result == 'success' || needs.python-core-integration-test.result == 'skipped') &&
      (needs.python-core-architecture-test.result == 'success' || needs.python-core-architecture-test.result == 'skipped')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v4
      - id: pyver
        run: echo "version=$(cat lang/python/.python-version)" >> $GITHUB_OUTPUT
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ steps.pyver.outputs.version }}
      - run: uv pip install --system -e lang/python/core
      - run: make install
        working-directory: lang/python/sdk
      - run: make architecture-test
        working-directory: lang/python/sdk

  python-sdk-e2e-suites:
    needs: [changes]
    if: |
      always() && !cancelled() && needs.changes.outputs.python-sdk == 'true'
    runs-on: ubuntu-latest
    outputs:
      suites: ${{ steps.list.outputs.suites }}
    steps:
      - uses: actions/checkout@v4
      - id: list
        run: |
          suites=$(grep -rL "Placeholder" lang/python/sdk/tests/e2e/*/test_scenarios.py | \
            sed 's|.*/e2e/||;s|/test_scenarios.py||' | \
            jq -R . | jq -sc .)
          echo "suites=$suites" >> $GITHUB_OUTPUT

  python-sdk-e2e-test:
    needs: [changes, python-sdk-e2e-suites, python-core-lint, python-core-unit-test, python-core-integration-test, python-core-architecture-test]
    if: |
      always() &&
      !cancelled() &&
      needs.changes.outputs.python-sdk == 'true' &&
      (needs.python-sdk-e2e-suites.result == 'success' || needs.python-sdk-e2e-suites.result == 'skipped') &&
      (needs.python-core-lint.result == 'success' || needs.python-core-lint.result == 'skipped') &&
      (needs.python-core-unit-test.result == 'success' || needs.python-core-unit-test.result == 'skipped') &&
      (needs.python-core-integration-test.result == 'success' || needs.python-core-integration-test.result == 'skipped') &&
      (needs.python-core-architecture-test.result == 'success' || needs.python-core-architecture-test.result == 'skipped')
    strategy:
      fail-fast: false
      matrix:
        suite: ${{ fromJSON(needs.python-sdk-e2e-suites.outputs.suites) }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v4
      - id: pyver
        run: echo "version=$(cat lang/python/.python-version)" >> $GITHUB_OUTPUT
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ steps.pyver.outputs.version }}
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Cache Lambda Docker images
        id: cache-lambda-images
        uses: actions/cache@v4
        with:
          path: /tmp/lambda-docker-images
          key: lambda-docker-python3.12-nodejs20
      - name: Load cached Lambda Docker images
        if: steps.cache-lambda-images.outputs.cache-hit == 'true'
        run: |
          docker load -i /tmp/lambda-docker-images/python312.tar
          docker load -i /tmp/lambda-docker-images/nodejs20.tar
      - name: Pull and cache Lambda Docker images
        if: steps.cache-lambda-images.outputs.cache-hit != 'true'
        run: |
          docker pull public.ecr.aws/lambda/python:3.12
          docker pull public.ecr.aws/lambda/nodejs:20
          mkdir -p /tmp/lambda-docker-images
          docker save public.ecr.aws/lambda/python:3.12 -o /tmp/lambda-docker-images/python312.tar
          docker save public.ecr.aws/lambda/nodejs:20 -o /tmp/lambda-docker-images/nodejs20.tar
      - run: uv pip install --system -e lang/python/core
      - run: make install
        working-directory: lang/python/sdk
      - name: Run e2e suite
        env:
          SUITE: ${{ matrix.suite }}
        run: uv run pytest "tests/e2e/$SUITE" -v
        working-directory: lang/python/sdk

  # ── TypeScript Core ─────────────────────────────────────────────────────────
  typescript-core-lint:
    needs: [changes]
    if: needs.changes.outputs.typescript-core == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Install
        working-directory: lang/typescript/core
        run: npm ci
      - name: Lint / format / complexity / cpd / type-check
        working-directory: lang/typescript/core
        run: make lint format-check complexity cpd type-check

  typescript-core-integration-test:
    needs: [changes]
    if: needs.changes.outputs.typescript-core == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Install
        working-directory: lang/typescript/core
        run: npm ci
      - name: Integration test
        working-directory: lang/typescript/core
        run: make integration-test

  typescript-core-architecture-test:
    needs: [changes]
    if: needs.changes.outputs.typescript-core == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Install
        working-directory: lang/typescript/core
        run: npm ci
      - name: Architecture test
        working-directory: lang/typescript/core
        run: make architecture-test

  # ── TypeScript SDK ─────────────────────────────────────────────────────────
  typescript-sdk-lint:
    needs: [changes, typescript-core-lint, typescript-core-integration-test, typescript-core-architecture-test]
    if: |
      always() &&
      !cancelled() &&
      needs.changes.outputs.typescript-sdk == 'true' &&
      (needs.typescript-core-lint.result == 'success' || needs.typescript-core-lint.result == 'skipped') &&
      (needs.typescript-core-integration-test.result == 'success' || needs.typescript-core-integration-test.result == 'skipped') &&
      (needs.typescript-core-architecture-test.result == 'success' || needs.typescript-core-architecture-test.result == 'skipped')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Install and build core
        working-directory: lang/typescript/core
        run: npm ci && npm run build
      - name: Install
        working-directory: lang/typescript/sdk
        run: npm ci
      - name: Lint / format / complexity / cpd / type-check
        working-directory: lang/typescript/sdk
        run: make lint format-check complexity cpd type-check

  typescript-sdk-unit-test:
    needs: [changes, typescript-core-lint, typescript-core-integration-test, typescript-core-architecture-test]
    if: |
      always() &&
      !cancelled() &&
      needs.changes.outputs.typescript-sdk == 'true' &&
      (needs.typescript-core-lint.result == 'success' || needs.typescript-core-lint.result == 'skipped') &&
      (needs.typescript-core-integration-test.result == 'success' || needs.typescript-core-integration-test.result == 'skipped') &&
      (needs.typescript-core-architecture-test.result == 'success' || needs.typescript-core-architecture-test.result == 'skipped')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Install core
        working-directory: lang/typescript/core
        run: npm ci
      - name: Build core
        working-directory: lang/typescript/core
        run: npm run build
      - name: Install sdk
        working-directory: lang/typescript/sdk
        run: npm ci
      - name: Unit test
        working-directory: lang/typescript/sdk
        run: make unit-test

  typescript-sdk-architecture-test:
    needs: [changes, typescript-core-lint, typescript-core-integration-test, typescript-core-architecture-test]
    if: |
      always() &&
      !cancelled() &&
      needs.changes.outputs.typescript-sdk == 'true' &&
      (needs.typescript-core-lint.result == 'success' || needs.typescript-core-lint.result == 'skipped') &&
      (needs.typescript-core-integration-test.result == 'success' || needs.typescript-core-integration-test.result == 'skipped') &&
      (needs.typescript-core-architecture-test.result == 'success' || needs.typescript-core-architecture-test.result == 'skipped')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Install core
        working-directory: lang/typescript/core
        run: npm ci
      - name: Build core
        working-directory: lang/typescript/core
        run: npm run build
      - name: Install sdk
        working-directory: lang/typescript/sdk
        run: npm ci
      - name: Architecture test
        working-directory: lang/typescript/sdk
        run: make architecture-test

  typescript-sdk-e2e-test:
    needs: [changes, typescript-core-lint, typescript-core-integration-test, typescript-core-architecture-test]
    if: |
      always() &&
      !cancelled() &&
      needs.changes.outputs.typescript-sdk == 'true' &&
      (needs.typescript-core-lint.result == 'success' || needs.typescript-core-lint.result == 'skipped') &&
      (needs.typescript-core-integration-test.result == 'success' || needs.typescript-core-integration-test.result == 'skipped') &&
      (needs.typescript-core-architecture-test.result == 'success' || needs.typescript-core-architecture-test.result == 'skipped')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Install core
        working-directory: lang/typescript/core
        run: npm ci
      - name: Build core
        working-directory: lang/typescript/core
        run: npm run build
      - name: Install sdk
        working-directory: lang/typescript/sdk
        run: npm ci
      - name: E2E test
        working-directory: lang/typescript/sdk
        run: make e2e-test

  # ── TypeScript Example ──────────────────────────────────────────────────────
  typescript-example-lint:
    needs: [changes, typescript-sdk-lint, typescript-sdk-unit-test, typescript-sdk-architecture-test, typescript-sdk-e2e-test]
    if: |
      always() &&
      !cancelled() &&
      needs.changes.outputs.typescript-example == 'true' &&
      (needs.typescript-sdk-lint.result == 'success' || needs.typescript-sdk-lint.result == 'skipped') &&
      (needs.typescript-sdk-unit-test.result == 'success' || needs.typescript-sdk-unit-test.result == 'skipped') &&
      (needs.typescript-sdk-architecture-test.result == 'success' || needs.typescript-sdk-architecture-test.result == 'skipped') &&
      (needs.typescript-sdk-e2e-test.result == 'success' || needs.typescript-sdk-e2e-test.result == 'skipped')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Install and build core
        working-directory: lang/typescript/core
        run: npm ci && npm run build
      - name: Install and build sdk
        working-directory: lang/typescript/sdk
        run: npm ci && npm run build
      - name: Install
        working-directory: lang/typescript/example
        run: npm ci
      - name: Lint / format / complexity / cpd / type-check
        working-directory: lang/typescript/example
        run: make lint format-check complexity cpd type-check

  typescript-example-unit-test:
    needs: [changes, typescript-sdk-lint, typescript-sdk-unit-test, typescript-sdk-architecture-test, typescript-sdk-e2e-test]
    if: |
      always() &&
      !cancelled() &&
      needs.changes.outputs.typescript-example == 'true' &&
      (needs.typescript-sdk-lint.result == 'success' || needs.typescript-sdk-lint.result == 'skipped') &&
