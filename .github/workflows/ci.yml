name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  pull-requests: write
  checks: write
  contents: read

jobs:
  # ── Detect changed paths ────────────────────────────────────────────────────
  changes:
    runs-on: ubuntu-latest
    outputs:
      core: ${{ steps.filter.outputs.core }}
      python: ${{ steps.filter.outputs.python }}
      typescript: ${{ steps.filter.outputs.typescript }}
      javascript: ${{ steps.filter.outputs.javascript }}
      java: ${{ steps.filter.outputs.java }}
      go: ${{ steps.filter.outputs.go }}
      sample-cdk: ${{ steps.filter.outputs.sample-cdk }}
      sample-hcl: ${{ steps.filter.outputs.sample-hcl }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            core:
              - 'core/**'
            python:
              - 'core/**'
              - 'lang/python/**'
            typescript:
              - 'core/**'
              - 'lang/typescript/**'
            javascript:
              - 'core/**'
              - 'lang/javascript/**'
            java:
              - 'core/**'
              - 'lang/java/**'
            go:
              - 'core/**'
              - 'lang/go/**'
            sample-cdk:
              - 'core/**'
              - 'sample-project-cdk/**'
            sample-hcl:
              - 'core/**'
              - 'sample-project-hcl/**'

  # ── Core (Python ldk) ──────────────────────────────────────────────────────
  core-lint:
    needs: [changes]
    if: needs.changes.outputs.core == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: make install
        working-directory: core
      - run: make lint
        working-directory: core
      - run: make format-check
        working-directory: core

  core-test:
    needs: [changes]
    if: needs.changes.outputs.core == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: make install
        working-directory: core
      - run: make test
        working-directory: core

  core-test-e2e:
    needs: [changes, core-lint, core-test]
    if: needs.changes.outputs.core == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Pull Lambda Docker images
        run: |
          docker pull public.ecr.aws/lambda/python:3.12
          docker pull public.ecr.aws/lambda/nodejs:20
      - run: make install
        working-directory: core
      - run: make test-e2e
        working-directory: core

  # ── Python SDK ─────────────────────────────────────────────────────────────
  python-sdk-test:
    needs: [changes, core-test-e2e]
    if: |
      always() &&
      needs.changes.outputs.python == 'true' &&
      (needs.core-test-e2e.result == 'success' || needs.core-test-e2e.result == 'skipped')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install ldk
        run: uv pip install --system -e core
      - name: Test
        working-directory: lang/python/sdk
        run: uv run pytest

  # ── TypeScript SDK ─────────────────────────────────────────────────────────
  typescript-sdk-test:
    needs: [changes, core-test-e2e]
    if: |
      always() &&
      needs.changes.outputs.typescript == 'true' &&
      (needs.core-test-e2e.result == 'success' || needs.core-test-e2e.result == 'skipped')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Install ldk
        run: uv pip install --system -e core
      - name: Test
        working-directory: lang/typescript/sdk
        run: npm ci && npm test

  # ── JavaScript SDK ─────────────────────────────────────────────────────────
  javascript-sdk-test:
    needs: [changes, core-test-e2e]
    if: |
      always() &&
      needs.changes.outputs.javascript == 'true' &&
      (needs.core-test-e2e.result == 'success' || needs.core-test-e2e.result == 'skipped')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Install ldk
        run: uv pip install --system -e core
      - name: Test
        working-directory: lang/javascript/sdk
        run: npm ci && npm test

  # ── Java SDK ───────────────────────────────────────────────────────────────
  java-sdk-test:
    needs: [changes, core-test-e2e]
    if: |
      always() &&
      needs.changes.outputs.java == 'true' &&
      (needs.core-test-e2e.result == 'success' || needs.core-test-e2e.result == 'skipped')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-java@v4
        with:
          java-version: "17"
          distribution: "temurin"
      - name: Install ldk
        run: uv pip install --system -e core
      - name: Test
        working-directory: lang/java/sdk
        run: ./gradlew test

  # ── Go SDK ─────────────────────────────────────────────────────────────────
  go-sdk-test:
    needs: [changes, core-test-e2e]
    if: |
      always() &&
      needs.changes.outputs.go == 'true' &&
      (needs.core-test-e2e.result == 'success' || needs.core-test-e2e.result == 'skipped')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-go@v5
        with:
          go-version: "1.23"
      - name: Install ldk
        run: uv pip install --system -e core
      - name: Test
        working-directory: lang/go/sdk
        run: go test ./...

  # ── Python Example ─────────────────────────────────────────────────────────
  python-example-test:
    needs: [changes, python-sdk-test]
    if: |
      always() &&
      needs.changes.outputs.python == 'true' &&
      needs.python-sdk-test.result == 'success'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install ldk and Python SDK
        run: |
          uv pip install --system -e core
          uv pip install --system -e lang/python/sdk
      - name: Test
        working-directory: lang/python/example
        run: uv run --extra test pytest

  # ── TypeScript Example ──────────────────────────────────────────────────────
  typescript-example-test:
    needs: [changes, typescript-sdk-test]
    if: |
      always() &&
      needs.changes.outputs.typescript == 'true' &&
      needs.typescript-sdk-test.result == 'success'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Install ldk
        run: uv pip install --system -e core
      - name: Test
        working-directory: lang/typescript/example
        run: npm ci && npm test

  # ── JavaScript Example ──────────────────────────────────────────────────────
  javascript-example-test:
    needs: [changes, javascript-sdk-test]
    if: |
      always() &&
      needs.changes.outputs.javascript == 'true' &&
      needs.javascript-sdk-test.result == 'success'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Install ldk
        run: uv pip install --system -e core
      - name: Test
        working-directory: lang/javascript/example
        run: npm ci && npm test

  # ── Java Example ────────────────────────────────────────────────────────────
  java-example-test:
    needs: [changes, java-sdk-test]
    if: |
      always() &&
      needs.changes.outputs.java == 'true' &&
      needs.java-sdk-test.result == 'success'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-java@v4
        with:
          java-version: "17"
          distribution: "temurin"
      - name: Install ldk
        run: uv pip install --system -e core
      - name: Publish SDK to mavenLocal
        working-directory: lang/java/sdk
        run: ./gradlew publishToMavenLocal
      - name: Test
        working-directory: lang/java/example
        run: ./gradlew test

  # ── Sample Project CDK ──────────────────────────────────────────────────────
  sample-project-cdk-build:
    needs: [changes, core-test-e2e]
    if: |
      always() &&
      needs.changes.outputs.sample-cdk == 'true' &&
      (needs.core-test-e2e.result == 'success' || needs.core-test-e2e.result == 'skipped')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Install dependencies
        working-directory: sample-project-cdk
        run: npm ci
      - name: CDK Synth
        working-directory: sample-project-cdk
        run: npx cdk synth

  # ── Sample Project HCL ──────────────────────────────────────────────────────
  sample-project-hcl-build:
    needs: [changes, core-test-e2e]
    if: |
      always() &&
      needs.changes.outputs.sample-hcl == 'true' &&
      (needs.core-test-e2e.result == 'success' || needs.core-test-e2e.result == 'skipped')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
      - name: Terraform Init
        working-directory: sample-project-hcl
        run: terraform init
      - name: Terraform Validate
        working-directory: sample-project-hcl
        run: terraform validate

  # ── Go Example ──────────────────────────────────────────────────────────────
  go-example-test:
    needs: [changes, go-sdk-test]
    if: |
      always() &&
      needs.changes.outputs.go == 'true' &&
      needs.go-sdk-test.result == 'success'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-go@v5
        with:
          go-version: "1.23"
      - name: Install ldk
        run: uv pip install --system -e core
      - name: Test
        working-directory: lang/go/example
        run: go test ./...
