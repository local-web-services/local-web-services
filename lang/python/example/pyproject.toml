[project]
name = "lws-python-example"
version = "0.1.0"
description = "Example project showing how to test Step Functions with the local-web-services Python SDK"
requires-python = ">=3.11"
dependencies = [
    "boto3",
]

[project.optional-dependencies]
test = []

[project.urls]
Homepage = "https://local-web-services.github.io"
Repository = "https://github.com/local-web-services/local-web-services"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
timeout = 120
pythonpath = ["."]
asyncio_mode = "auto"
markers = [
    "internal: scenarios tagged @internal in Gherkin (excluded from standard test runs)",
]

[dependency-groups]
dev = [
    "local-web-services",
    "local-web-services-python-sdk",
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "pytest-bdd>=8.1.0",
    "pytest-timeout>=2.3.0",
    "boto3>=1.34.0",
    "black>=24.0.0",
    "ruff>=0.4.0",
    "radon>=6.0.0",
    "lws-arch-tests",
]

[tool.uv.sources]
local-web-services = { path = "../core", editable = true }
local-web-services-python-sdk = { path = "../sdk", editable = true }
lws-arch-tests = { path = "../arch_tests", editable = true }

[tool.black]
line-length = 100
target-version = ["py311"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "W", "UP", "C90"]

[tool.ruff.lint.mccabe]
max-complexity = 10

[tool.pylint."messages control"]
disable = [
    "E0401", "W0718", "R0801", "C0301", "C0302", "C0114", "C0115",
    "R0903", "R0902", "R0913", "R0917", "R0904", "R0911", "R0914", "C0103",
    "W0603", "W0621",
]
