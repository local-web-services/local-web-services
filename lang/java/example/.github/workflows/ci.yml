name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install ldk
        run: pip install local-web-services

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Install Java SDK from source
        run: |
          git clone https://github.com/local-web-services/local-web-services-java-sdk.git /tmp/lws-java-sdk
          cd /tmp/lws-java-sdk
          ./gradlew publishToMavenLocal

      - name: Run tests
        run: ./gradlew test
        env:
          GITHUB_ACTOR: ${{ github.actor }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
