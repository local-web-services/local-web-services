plugins {
    id 'java'
    id 'checkstyle'
    id 'pmd'
    id 'com.github.spotbugs' version '6.1.7'
    id 'com.diffplug.spotless' version '6.25.0'
}

group = 'com.example'
version = '0.1.0'

java {
    sourceCompatibility = JavaVersion.VERSION_17
    targetCompatibility = JavaVersion.VERSION_17
}

repositories {
    mavenLocal()
    mavenCentral()
}

def awsSdkVersion = '2.26.0'
def cucumberVersion = '7.18.0'

sourceSets {
    test {
        resources {
            srcDir '../../specification/example'
        }
    }
    architectureTest {
        java { srcDir 'src/architectureTest/java' }
        compileClasspath += sourceSets.main.output
        runtimeClasspath += sourceSets.main.output
    }
}

configurations {
    architectureTestImplementation.extendsFrom testImplementation
    architectureTestRuntimeOnly.extendsFrom testRuntimeOnly
}

dependencies {
    implementation platform("software.amazon.awssdk:bom:${awsSdkVersion}")
    implementation 'software.amazon.awssdk:sfn'
    implementation 'software.amazon.awssdk:dynamodb'
    implementation 'software.amazon.awssdk:sqs'

    testImplementation files('/tmp/gradle-build-lws-java-sdk/libs/local-web-services-java-sdk-0.2.2.jar')
    testImplementation files('/tmp/gradle-build-lws-java-core/libs/lws-java-core-0.1.0.jar')
    testImplementation 'com.fasterxml.jackson.core:jackson-databind:2.17.0'
    testImplementation platform('org.junit:junit-bom:5.10.2')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testImplementation "io.cucumber:cucumber-java:${cucumberVersion}"
    testImplementation "io.cucumber:cucumber-junit-platform-engine:${cucumberVersion}"
    testImplementation "io.cucumber:cucumber-picocontainer:${cucumberVersion}"
    testImplementation 'org.junit.platform:junit-platform-suite'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'

    architectureTestImplementation 'org.junit.jupiter:junit-jupiter:5.10.2'
    architectureTestImplementation 'org.junit.platform:junit-platform-launcher:1.10.2'
    architectureTestImplementation files('../arch_tests/build/libs/arch_tests.jar')
}

checkstyle {
    toolVersion = '10.17.0'
    configFile = file('../config/checkstyle/checkstyle.xml')
}

pmd {
    toolVersion = '7.13.0'
    consoleOutput = true
    ruleSets = []
    ruleSetConfig = resources.text.fromFile('../config/pmd/pmd-ruleset.xml')
}

spotbugs {
    toolVersion = '4.9.3'
    ignoreFailures = false
    excludeFilter = file('../config/spotbugs/exclude.xml')
}

spotless {
    java {
        googleJavaFormat('1.22.0')
        target 'src/**/*.java'
    }
}

test {
    useJUnitPlatform()
    systemProperty 'cucumber.junit-platform.naming-strategy', 'long'
    testLogging {
        events 'passed', 'skipped', 'failed'
    }
}

task architectureTest(type: Test) {
    testClassesDirs = sourceSets.architectureTest.output.classesDirs
    classpath = sourceSets.architectureTest.runtimeClasspath
    useJUnitPlatform()
    systemProperty 'arch.src.root', "${projectDir}/src/main/java"
    systemProperty 'arch.tests.root', "${projectDir}/src/test/java"
}
