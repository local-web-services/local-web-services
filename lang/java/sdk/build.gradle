plugins {
    id 'java-library'
    id 'maven-publish'
    id 'checkstyle'
    id 'pmd'
    id 'com.github.spotbugs' version '6.1.7'
    id 'com.diffplug.spotless' version '6.25.0'
}

group = 'io.localwebservices'
version = '0.2.2'

java {
    sourceCompatibility = JavaVersion.VERSION_17
    targetCompatibility = JavaVersion.VERSION_17
}

repositories {
    mavenCentral()
}

def awsSdkVersion = '2.32.26'
def cucumberVersion = '7.15.0'

sourceSets {
    test {
        resources {
            srcDir '../../specification/sdk'
            srcDir '../../specification/core/informal'
        }
    }
    architectureTest {
        java { srcDir 'src/architectureTest/java' }
        compileClasspath += sourceSets.main.output
        runtimeClasspath += sourceSets.main.output
    }
}

configurations {
    architectureTestImplementation.extendsFrom testImplementation
    architectureTestRuntimeOnly.extendsFrom testRuntimeOnly
}

dependencies {
    api platform("software.amazon.awssdk:bom:${awsSdkVersion}")
    api 'software.amazon.awssdk:dynamodb'
    api 'software.amazon.awssdk:sqs'
    api 'software.amazon.awssdk:s3'
    api 'software.amazon.awssdk:sns'
    api 'software.amazon.awssdk:eventbridge'
    api 'software.amazon.awssdk:sfn'
    api 'software.amazon.awssdk:ssm'
    api 'software.amazon.awssdk:secretsmanager'
    api 'software.amazon.awssdk:cognitoidentityprovider'
    api 'software.amazon.awssdk:apigateway'
    api 'software.amazon.awssdk:lambda'
    api 'software.amazon.awssdk:rds'
    api 'software.amazon.awssdk:docdb'
    api 'software.amazon.awssdk:neptune'
    api 'software.amazon.awssdk:elasticache'
    api 'software.amazon.awssdk:memorydb'
    api 'software.amazon.awssdk:glacier'
    api 'software.amazon.awssdk:elasticsearch'
    api 'software.amazon.awssdk:opensearch'
    api 'software.amazon.awssdk:s3tables:2.32.26'
    api 'software.amazon.awssdk:organizations'
    implementation 'com.fasterxml.jackson.core:jackson-databind:2.17.0'

    // Java core in-process server — available in main source for direct type reference
    implementation files('/tmp/gradle-build-lws-java-core/libs/lws-java-core-0.1.0.jar')

    // JUnit 5 API — compileOnly so the extension classes compile without requiring
    // users to add JUnit as a runtime dependency (they already have it for testing)
    compileOnly platform('org.junit:junit-bom:5.10.2')
    compileOnly 'org.junit.jupiter:junit-jupiter-api'

    testImplementation platform('org.junit:junit-bom:5.10.2')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'

    testImplementation "io.cucumber:cucumber-java:${cucumberVersion}"
    testImplementation "io.cucumber:cucumber-junit-platform-engine:${cucumberVersion}"
    testImplementation "io.cucumber:cucumber-picocontainer:${cucumberVersion}"
    testImplementation 'org.junit.platform:junit-platform-suite:1.10.2'

    architectureTestImplementation 'org.junit.jupiter:junit-jupiter:5.10.2'
    architectureTestImplementation 'org.junit.platform:junit-platform-launcher:1.10.2'
    architectureTestImplementation files('../arch_tests/build/libs/arch_tests.jar')
}

checkstyle {
    toolVersion = '10.17.0'
    configFile = file('../config/checkstyle/checkstyle.xml')
}

pmd {
    toolVersion = '7.13.0'
    consoleOutput = true
    ruleSets = []
    ruleSetConfig = resources.text.fromFile('../config/pmd/pmd-ruleset.xml')
}

spotbugs {
    toolVersion = '4.9.3'
    ignoreFailures = false
    excludeFilter = file('../config/spotbugs/exclude.xml')
}

spotless {
    java {
        googleJavaFormat('1.22.0')
        target 'src/**/*.java'
    }
}

test {
    useJUnitPlatform()
    maxHeapSize = '2g'
    systemProperty 'cucumber.junit-platform.naming-strategy', 'long'
    testLogging {
        events 'passed', 'skipped', 'failed'
        showStandardStreams = false
    }
}

task architectureTest(type: Test) {
    testClassesDirs = sourceSets.architectureTest.output.classesDirs
    classpath = sourceSets.architectureTest.runtimeClasspath
    useJUnitPlatform()
    systemProperty 'arch.src.root', "${projectDir}/src/main/java"
    systemProperty 'arch.tests.root', "${projectDir}/src/test/java"
}

publishing {
    publications {
        gpr(MavenPublication) {
            from components.java
        }
    }
    repositories {
        maven {
            name = 'GitHubPackages'
            url = uri('https://maven.pkg.github.com/local-web-services/local-web-services')
            credentials {
                username = System.getenv('GITHUB_ACTOR')
                password = System.getenv('GITHUB_TOKEN')
            }
        }
    }
}
