name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.21'

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install ldk
        run: pip install local-web-services

      - name: Clone Go SDK
        uses: actions/checkout@v4
        with:
          repository: local-web-services/local-web-services-go-sdk
          path: local-web-services-go-sdk

      - name: Use local Go SDK
        run: go mod edit -replace github.com/local-web-services/local-web-services-go-sdk=./local-web-services-go-sdk

      - name: Download dependencies
        run: go mod tidy

      - name: Run tests
        run: go test ./... -v -timeout 120s
